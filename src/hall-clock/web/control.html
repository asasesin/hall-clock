<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hall Clock Control</title>
    <meta name="theme-color" content="#07090b">
    <!-- Home-screen install: iOS reads the apple-* tags (and keeps its own
         localStorage, so the installed app asks for the PIN once); Android
         reads the manifest. Over plain HTTP Android gets a shortcut rather
         than a full standalone install — see the Caddyfile for why HTTP. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Hall Clock">
    <link rel="manifest" href="/assets/control.webmanifest">
    <link rel="apple-touch-icon" href="/assets/icon-control-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-control-192.png">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body class="control-page">
    <main class="phone-shell">
      <section id="tokenWarning" class="notice hidden" role="alert">
        The clock refused that command. Reload the page if it keeps happening.
      </section>
      <section id="offlineNotice" class="notice hidden" role="status">
        Connection to the clock lost &mdash; reconnecting&hellip;
      </section>
      <section id="commandNotice" class="notice hidden" role="status">
        That didn&rsquo;t reach the clock. Check the connection and try again.
      </section>
      <section id="installHint" class="notice install-hint hidden" role="status">
        <p id="installHintText"></p>
        <button id="installHintDismiss" class="small-button" type="button">Got it</button>
      </section>

      <section class="compact-timer">
        <div class="timer-meta">
          <p id="meetingType" class="meeting-chip">Midweek meeting</p>
        </div>
        <div id="timeValue" class="control-time">00:00</div>
        <p id="nowPartTitle" class="card-now hidden"></p>
        <p id="meetingOvertime" class="card-overrun hidden" role="status"></p>
        <p id="nextPart" class="card-next"></p>
        <div class="timer-adjust">
          <p id="stepperLabel" class="stepper-label">Adjust time</p>
          <div class="timer-stepper" role="group" aria-labelledby="stepperLabel">
            <button data-adjust="-60" class="action adjust-action" type="button" aria-label="Subtract 1 minute">
              <span class="adjust-symbol">-</span>
              <span class="adjust-label">1 min</span>
            </button>
            <button data-adjust="60" class="action adjust-action" type="button" aria-label="Add 1 minute">
              <span class="adjust-symbol">+</span>
              <span class="adjust-label">1 min</span>
            </button>
          </div>
        </div>
      </section>

      <section class="control-panel">
        <p class="card-eyebrow">Controls</p>
        <div class="control-actions">
          <div class="primary-action-row">
            <button id="startBtn" class="action action-primary" type="button">Start</button>
          </div>

          <div class="advance-action-row">
            <button id="nextBtn" class="action action-next" type="button">Next part</button>
          </div>

          <div class="advance-action-row">
            <button id="endBtn" class="action action-end slot-hidden" type="button">End meeting</button>
          </div>
        </div>
      </section>

      <section id="partsPanel" class="tab-panel">
        <div class="part-picker-field">
          <span class="control-field-label">Jump to item</span>
          <div class="current-item-row">
            <button id="partPickerBtn" class="part-picker-button" type="button" aria-expanded="false" aria-controls="partPickerList">
              <span id="currentPartTitle">Select item</span>
              <span id="currentPartDuration" class="part-duration"></span>
            </button>
            <button id="adhocPartBtn" class="temporary-part-button" type="button" aria-expanded="false" aria-controls="adhocPartPanel" aria-label="Add temporary item" title="Add temporary item">
              <span class="temporary-part-icon" aria-hidden="true">+</span>
            </button>
          </div>
        </div>
        <div id="partPickerList" class="part-picker-list hidden"></div>
        <form id="adhocPartPanel" class="adhoc-part-panel hidden">
          <label class="temporary-part-title">
            <span>Title</span>
            <input id="adhocPartTitleInput" type="text" maxlength="80" placeholder="Additional item">
          </label>
          <label class="temporary-part-position">
            <span>Add after</span>
            <select id="adhocPartAfterSelect"></select>
          </label>
          <label>
            <span>Min</span>
            <input id="adhocPartMinutesInput" type="number" min="1" max="120" inputmode="numeric" value="5">
          </label>
          <button id="saveAdhocPartBtn" class="small-button" type="submit">Add</button>
          <button id="cancelAdhocPartBtn" class="small-button" type="button">Cancel</button>
        </form>

        <!-- Pre-meeting schedule setup: both controls lock once the timer runs,
             so they sit below the live item controls the operator uses mid-meeting. -->
        <div class="schedule-setup">
          <label class="language-row">
            <span>Schedule language</span>
            <select id="languageSelect">
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="tw">Twi</option>
            </select>
          </label>
          <p id="languageStatus" class="language-hint hidden" aria-live="polite"></p>
          <div class="co-row">
            <div class="co-row-text">
              <span class="co-row-label">Circuit overseer visit</span>
              <span class="co-row-hint hidden" id="coHint"></span>
            </div>
            <button id="coToggle" class="co-toggle" type="button" role="switch" aria-checked="false" aria-label="Circuit overseer visit" title="Swap in the circuit overseer visit schedule">
              <span class="co-toggle-track"><span class="co-toggle-thumb"></span></span>
            </button>
          </div>
        </div>
      </section>

      <footer class="controller-admin">
        <a href="/setup">Setup</a>
      </footer>
    </main>
    <script src="/assets/shared.js"></script>
    <script src="/assets/control.js"></script>
  </body>
</html>
